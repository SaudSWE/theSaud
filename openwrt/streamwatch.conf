# /etc/streamwatch/streamwatch.conf
# Sourced by /etc/init.d/streamwatch. Change these, then:
#   /etc/init.d/streamwatch restart
# The allow/deny lists are NOT here -- they live in /etc/streamwatch/allow.txt
# and deny.txt and are edited with group_lists.py (or by hand); the running
# service reloads them live, no restart needed.

# Where alerts and command replies go, and whose commands are honoured.
SW_EMAIL_TO="manaratcyber@gmail.com"

# Per-device traffic-alert threshold (e.g. 500M, 2G). Raise it to cut email noise.
SW_THRESHOLD="500M"

# Extra flags. Keep --group-lists to enforce the allow/deny files, and
# --accept-commands so open()/close() by email work. Add others as needed,
# e.g. --dns-watch, --usage-report, --allow-file / --deny-file for custom paths.
SW_EXTRA="--accept-commands --group-lists"
